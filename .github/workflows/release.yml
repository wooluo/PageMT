name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package zip
        run: |
          zip -r "PageMT-${GITHUB_REF_NAME}.zip" manifest.json background.js content.js content.css lib popup icons LICENSE README.md
      - name: Create release & upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "PageMT-${GITHUB_REF_NAME}.zip" --generate-notes --title "$GITHUB_REF_NAME" \
            || gh release upload "$GITHUB_REF_NAME" "PageMT-${GITHUB_REF_NAME}.zip" --clobber
